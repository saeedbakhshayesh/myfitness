{% extends "layout.html" %}

{% block title %}Login{% endblock %}

{% block auth_main %}
<form action="/login" method="post" autocomplete="off">
    <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input class="form-control" id="username" name="username" placeholder="Your username" type="text" autofocus required>
    </div>
    <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" id="password" name="password" placeholder="Your password" type="password" required>
    </div>
    <button class="btn btn-primary mt-2" type="submit">
        <i class="bi bi-box-arrow-in-right"></i> Log In
    </button>
</form>

<p class="text-center mt-3" style="color:var(--gray); font-size:14px;">
    Don't have an account?
    <a href="/register" style="color:var(--black); font-weight:600; text-decoration:underline;">Register</a>
</p>
{% endblock %}
