{% extends "layout.html" %}

{% block title %}Register{% endblock %}

{% block auth_main %}
<form action="/register" method="post" autocomplete="off">
    <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input class="form-control" id="username" name="username" placeholder="Choose a username" type="text" autofocus required>
    </div>
    <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" id="password" name="password" placeholder="Create a password" type="password" required>
    </div>
    <div class="form-group">
        <label class="form-label" for="confirmation">Confirm Password</label>
        <input class="form-control" id="confirmation" name="confirmation" placeholder="Confirm your password" type="password" required>
    </div>
    <button class="btn btn-primary mt-2" type="submit">
        <i class="bi bi-person-plus-fill"></i> Create Account
    </button>
</form>

<p class="text-center mt-3" style="color:var(--gray); font-size:14px;">
    Already have an account?
    <a href="/login" style="color:var(--black); font-weight:600; text-decoration:underline;">Log in</a>
</p>
{% endblock %}
