{% extends "layout.html" %}

{% block title %}Edit Workout{% endblock %}
{% block page_title %}Edit Workout{% endblock %}

{% block main %}
<div class="page-header">
    <div>
        <h2>Edit Workout</h2>
        <p>Update your session details.</p>
    </div>
</div>

<div class="card" style="max-width:720px;">
    <form action="/edit/{{ workout.id }}" method="post">
        <div class="grid-2">
            <div class="form-group">
                <label class="form-label">Workout Type</label>
                <input class="form-control" name="type" value="{{ workout.type }}" required>
            </div>
            <div class="form-group">
                <label class="form-label">Category</label>
                <select class="form-select" name="category" required>
                    {% for c in ['Cardio', 'Strength', 'Flexibility', 'Other'] %}
                    <option value="{{ c }}" {% if workout.category == c %}selected{% endif %}>{{ c }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label class="form-label">Duration (minutes)</label>
                <input class="form-control" name="duration" type="number" min="1" value="{{ workout.duration }}" required>
            </div>
            <div class="form-group">
                <label class="form-label">Calories Burned</label>
                <input class="form-control" name="calories" type="number" min="0" value="{{ workout.calories }}" required>
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label class="form-label">Date</label>
                <input class="form-control" name="date" type="date" value="{{ workout.date }}" required>
            </div>
            <div class="form-group">
                <label class="form-label">Mood</label>
                <select class="form-select" name="mood">
                    <option value="">—</option>
                    {% for m in ['💪 Strong', '🔥 Energized', '😊 Good', '😐 Okay', '😴 Tired'] %}
                    <option value="{{ m }}" {% if workout.mood == m %}selected{% endif %}>{{ m }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Notes</label>
            <textarea class="form-control" name="notes">{{ workout.notes or '' }}</textarea>
        </div>

        <div style="display:flex; gap:12px;">
            <button class="btn btn-primary" type="submit"><i class="bi bi-check-lg"></i> Save Changes</button>
            <a href="/workouts" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
